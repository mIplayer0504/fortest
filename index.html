<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="한능검">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>한능검 매칭 퀴즈</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --gold: #c9a227;
    --gold-light: #e8c547;
    --text: #e8e8f0;
    --text-muted: #8888aa;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --hint: #3498db;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .logo span { color: var(--text-muted); font-weight: 400; font-size: 0.9rem; margin-left: 8px; }

  .header-stats {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .stat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .stat-chip .val {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .stat-chip .val.gold  { color: var(--gold); }
  .stat-chip .val.green { color: var(--correct); }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    gap: 10px;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    background: #13151f;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { color: var(--text-muted); font-size: 0.8rem; margin-right: 4px; white-space: nowrap; }
  .filter-btn {
    background: var(--border);
    border: 1.5px solid transparent;
    color: var(--text-muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--gold); color: var(--text); }
  .filter-btn.active { background: var(--gold); color: #000; font-weight: 700; border-color: var(--gold); }
  .filter-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* MODE BAR */
  .mode-row {
    display: flex;
    gap: 8px;
    padding: 10px 32px;
    background: #13151f;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .mode-label { color: var(--text-muted); font-size: 0.8rem; margin-right: 4px; white-space: nowrap; }
  .mode-btn {
    background: var(--border);
    border: 1.5px solid transparent;
    color: var(--text-muted);
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .mode-btn:hover { border-color: var(--gold); color: var(--text); }
  .mode-btn.active { background: rgba(201,162,39,0.2); border-color: var(--gold); color: var(--gold-light); font-weight: 700; }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .quiz-wrap {
    width: 100%;
    max-width: 720px;
    position: relative;
  }

  /* PROGRESS */
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* QUIZ CARD */
  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 44px;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .quiz-card.correct { border-color: var(--correct); }
  .quiz-card.wrong   { border-color: var(--wrong); }

  .card-meta {
    display: none;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .card-meta.visible { display: flex; }
  .meta-tag {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .meta-tag.type { background: rgba(201,162,39,0.15); color: var(--gold); border-color: rgba(201,162,39,0.3); }

  .q-number {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .question-text {
    font-size: 1.55rem;
    font-weight: 600;
    line-height: 1.65;
    margin-bottom: 36px;
    color: var(--text);
  }

  .type-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .type-hint strong { color: var(--gold); }

  /* INPUT */
  .answer-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .input-wrap { position: relative; flex: 1; }
  .answer-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 1.05rem;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }
  .answer-input:focus { border-color: var(--gold); background: rgba(201,162,39,0.05); }
  .answer-input.correct { border-color: var(--correct); background: rgba(46,204,113,0.08); }
  .answer-input.wrong   { border-color: var(--wrong);   background: rgba(231,76,60,0.08); }
  .answer-input:disabled { opacity: 0.8; }
  .answer-input.open { border-radius: 12px 12px 0 0; border-bottom-color: var(--gold); }

  .submit-btn {
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px 26px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .submit-btn:hover { background: var(--gold-light); }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  /* AUTOCOMPLETE */
  .autocomplete-list {
    position: absolute;
    left: 0; right: 0;
    background: var(--card);
    border: 1.5px solid var(--gold);
    border-top: none;
    border-radius: 0 0 12px 12px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .autocomplete-list.show { display: block; }
  .ac-item {
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text-muted);
    transition: background 0.1s;
    border-bottom: 1px solid var(--border);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.selected { background: rgba(201,162,39,0.15); color: var(--text); }
  .ac-item mark { background: none; color: var(--gold); font-weight: 700; }

  /* HINT */
  .hint-row { margin-top: 14px; }
  .hint-toggle {
    background: none;
    border: none;
    color: var(--hint);
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    opacity: 0.8;
    transition: opacity 0.15s;
  }
  .hint-toggle:hover { opacity: 1; }
  .hint-box {
    margin-top: 10px;
    padding: 10px 16px;
    background: rgba(52,152,219,0.1);
    border: 1px solid rgba(52,152,219,0.25);
    border-radius: 10px;
    font-size: 0.9rem;
    color: var(--hint);
    display: none;
  }
  .hint-box.show { display: block; }

  /* FEEDBACK */
  .feedback {
    margin-top: 20px;
    padding: 16px 20px;
    border-radius: 12px;
    display: none;
    align-items: flex-start;
    gap: 12px;
  }
  .feedback.show { display: flex; }
  .feedback.correct { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3); }
  .feedback.wrong   { background: rgba(231,76,60,0.10);  border: 1px solid rgba(231,76,60,0.3); }
  .fb-icon { font-size: 1.3rem; flex-shrink: 0; line-height: 1; }
  .fb-text { flex: 1; }
  .fb-text .fb-label { font-weight: 700; margin-bottom: 4px; }
  .fb-text .fb-answer { font-size: 1.05rem; font-weight: 600; margin-top: 4px; }
  .feedback.correct .fb-label { color: var(--correct); }
  .feedback.wrong   .fb-label { color: var(--wrong); }
  .fb-accept { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

  /* ACTION BTNS */
  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    justify-content: flex-end;
  }
  .action-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 8px 18px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .action-btn:hover { border-color: var(--gold); color: var(--text); }
  .action-btn.next-btn {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
    font-weight: 700;
  }
  .action-btn.next-btn:hover { background: var(--gold-light); border-color: var(--gold-light); }

  /* SKIP */
  .skip-row { text-align: center; margin-top: 14px; }
  .skip-btn {
    background: none; border: none;
    color: var(--text-muted); font-family: inherit;
    font-size: 0.8rem; cursor: pointer; opacity: 0.7;
  }
  .skip-btn:hover { opacity: 1; }

  /* TOP BTNS */
  .top-btns { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: var(--border);
    border: none;
    color: var(--text-muted);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .icon-btn:hover { background: rgba(201,162,39,0.2); color: var(--gold); }

  /* STREAK BADGE */
  .streak-badge {
    position: fixed;
    top: 80px; right: 24px;
    background: linear-gradient(135deg, #ff6b35, #ff4500);
    color: #fff;
    border-radius: 16px;
    padding: 10px 18px;
    font-size: 0.85rem; font-weight: 700;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0;
    transform: translateY(-10px) scale(0.9);
    transition: all 0.3s ease;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
    z-index: 50;
  }
  .streak-badge.show { opacity: 1; transform: translateY(0) scale(1); }
  .streak-badge .streak-num   { font-size: 1.8rem; line-height: 1; }
  .streak-badge .streak-label { font-size: 0.7rem; opacity: 0.9; }

  /* WRONG NOTE */
  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .panel-overlay.show { display: flex; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%; max-width: 680px; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  .panel-title { font-size: 1.1rem; font-weight: 700; }
  .panel-close {
    background: none; border: none; color: var(--text-muted);
    font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px;
  }
  .panel-body { overflow-y: auto; padding: 20px 24px; }
  .wrong-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-q { font-size: 1rem; margin-bottom: 6px; color: var(--text); }
  .wrong-a { font-size: 0.85rem; color: var(--wrong); }
  .wrong-a span { color: var(--text-muted); }
  .empty-msg { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.95rem; }

  /* ANIMATIONS */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
  .confetti-piece {
    position: absolute; opacity: 0;
    animation: confettiFall 1.2s ease forwards;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(80vh) rotate(720deg); }
  }

  /* ══════════════════════════════════
     모바일 반응형 — 요소 변경 없음
  ══════════════════════════════════ */
  @media (max-width: 640px) {
    html, body {
      overscroll-behavior: none;
      overflow-x: hidden;
    }
    body {
      min-height: -webkit-fill-available;
    }
    header {
      padding: 12px 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo span { display: none; }
    .header-stats { gap: 14px; }
    .stat-chip .val { font-size: 1rem; }
    .stat-chip { font-size: 0.68rem; }
    .icon-btn { padding: 6px 10px; font-size: 0.72rem; }
    .top-btns { gap: 6px; }

    .filter-bar {
      padding: 10px 12px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      gap: 7px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .mode-row {
      padding: 8px 12px;
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mode-row::-webkit-scrollbar { display: none; }

    main { padding: 20px 12px; justify-content: flex-start; }

    .progress-bar { margin-bottom: 18px; }

    .quiz-card { padding: 22px 18px; }
    .question-text { font-size: 1.2rem; margin-bottom: 24px; }
    .type-hint { font-size: 0.82rem; margin-bottom: 14px; }

    .answer-row { flex-direction: column; gap: 8px; }
    .answer-input { padding: 13px 16px; font-size: 0.98rem; }
    .submit-btn { width: 100%; padding: 13px; }

    .action-row { flex-direction: column-reverse; }
    .action-btn { width: 100%; text-align: center; padding: 12px; }

    .streak-badge { top: auto; bottom: 20px; right: 16px; }

    .panel { max-height: 90vh; }
    .panel-body { padding: 14px 16px; }
    .panel-header { padding: 16px; }

    /* safe area — 브라우저에서는 0이라 영향 없음, PWA에서만 실제 값 적용 */
    header {
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }
    body {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">한능검 매칭 퀴즈 <span>한국사능력검정시험</span></div>
  <div class="header-stats">
    <div class="stat-chip">
      <span class="val" id="statTotal">0</span>
      <span>총 문제</span>
    </div>
    <div class="stat-chip">
      <span class="val green" id="statCorrect">0</span>
      <span>정답</span>
    </div>
    <div class="stat-chip">
      <span class="val gold" id="statRate">0%</span>
      <span>정답률</span>
    </div>
    <div class="top-btns">
      <button class="icon-btn" onclick="openWrongNote()">오답노트 (<span id="wrongCount">0</span>)</button>
      <button class="icon-btn" onclick="resetStats()">초기화</button>
    </div>
  </div>
</header>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">단원</span>
  <button class="filter-btn active" data-unit="all" onclick="setFilter('unit','all')">전체</button>
</div>

<div class="mode-row">
  <span class="mode-label">모드</span>
  <button class="mode-btn active" data-mode="type"  onclick="setMode('type')">직접 입력</button>
  <button class="mode-btn"        data-mode="hint"  onclick="setMode('hint')">힌트 모드</button>
  <button class="mode-btn"        data-mode="wrong" onclick="setMode('wrong')">오답만</button>
</div>

<main>
  <div class="quiz-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <div class="quiz-card" id="quizCard">
      <div class="card-meta" id="cardMeta"></div>
      <div class="q-number" id="qNumber"></div>
      <div class="question-text" id="questionText"></div>
      <div class="type-hint" id="typeHint"></div>

      <div class="answer-row">
        <div class="input-wrap">
          <input class="answer-input" id="answerInput"
            type="text" placeholder="정답을 입력하고 Enter"
            autocomplete="off" autocorrect="off" spellcheck="false" />
          <div class="autocomplete-list" id="acList"></div>
        </div>
        <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">확인</button>
      </div>

      <div class="hint-row" id="hintRow">
        <button class="hint-toggle" id="hintToggleBtn" onclick="toggleHint()">힌트 보기</button>
        <div class="hint-box" id="hintBox"></div>
      </div>

      <div class="feedback" id="feedback">
        <div class="fb-icon" id="fbIcon"></div>
        <div class="fb-text">
          <div class="fb-label" id="fbLabel"></div>
          <div class="fb-answer" id="fbAnswer"></div>
          <div class="fb-accept" id="fbAccept"></div>
        </div>
      </div>

      <div class="action-row" id="actionRow" style="display:none">
        <button class="action-btn" onclick="skipQuestion()">건너뛰기</button>
        <button class="action-btn next-btn" onclick="nextQuestion()">다음 문제 →</button>
      </div>
    </div>

    <div class="skip-row" id="skipRow">
      <button class="skip-btn" onclick="skipQuestion()">이 문제 건너뛰기</button>
    </div>
  </div>
</main>

<div class="streak-badge" id="streakBadge">
  <span class="streak-num" id="streakNum">0</span>
  <span class="streak-label">연속 정답</span>
</div>

<div class="panel-overlay" id="wrongPanel">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">오답 노트</div>
      <button class="panel-close" onclick="closeWrongNote()">×</button>
    </div>
    <div class="panel-body" id="wrongBody"></div>
  </div>
</div>

// PERSIST
function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem('haneung_stats') || '{}');
    stats     = d.stats     || { total: 0, correct: 0 };
    wrongList = d.wrongList || [];
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('haneung_stats', JSON.stringify({ stats, wrongList }));
}

// FILTER BAR
function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  bar.querySelectorAll('[data-unit]:not([data-unit="all"])').forEach(b => b.remove());
  [...new Set(QUESTIONS_DATA.map(q => q.unit))].forEach(u => {
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.dataset.unit = u;
    b.textContent = u.substring(0, 20);
    b.onclick = () => setFilter('unit', u);
    bar.appendChild(b);
  });
}

function setFilter(key, val) {
  unitFilter = val;
  document.querySelectorAll('[data-unit]').forEach(b =>
    b.classList.toggle('active', b.dataset.unit === val));
  buildQueue(); nextQuestion(true);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === m));
  buildQueue(); nextQuestion(true);
}

// QUEUE
function buildQueue() {
  let pool = QUESTIONS_DATA;
  if (unitFilter !== 'all') pool = pool.filter(q => q.unit === unitFilter);
  if (mode === 'wrong') {
    const ids = new Set(wrongList.map(w => w.id));
    const sub = pool.filter(q => ids.has(q.id));
    if (sub.length) pool = sub;
  }
  queue = shuffle([...pool]);
  currentIdx = 0;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ANSWER CHECK
function normalize(s) {
  return (s||'').replace(/\s/g,'').replace(/[·\-\(\)\[\]]/g,'').replace(/\./g,'').toLowerCase();
}
function getAccepted(answer) {
  const v = [answer];
  if (answer.includes('(')) {
    v.push(answer.split('(')[0].trim());
    const inside = (answer.match(/\(([^)]+)\)/) || [])[1];
    if (inside) v.push(inside);
  }
  if (answer.includes(' - ')) v.push(answer.split(' - ').slice(1).join(' - ').trim());
  if (answer.endsWith(' 시대')) v.push(answer.slice(0,-3).trim());
  v.push(answer.replace(/·/g,'.'), answer.replace(/·/g,''));
  return [...new Set(v.map(normalize))].filter(Boolean);
}
function checkAnswer(input, answer) {
  const ni = normalize(input.trim());
  if (!ni) return false;
  return getAccepted(answer).some(a => a === ni);
}

// RENDER
function renderQuestion(q) {
  current = q; answered = false; hintLevel = 0;

  document.getElementById('cardMeta').innerHTML =
    `<span class="meta-tag">${q.unit}</span>
     <span class="meta-tag">${q.subUnit}</span>
     <span class="meta-tag type">${q.type}</span>`;
  document.getElementById('cardMeta').classList.remove('visible');
  document.getElementById('qNumber').textContent = `#${currentIdx + 1} / ${queue.length}`;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('typeHint').innerHTML = `정답 유형: <strong>${q.type}</strong>`;

  const inp = document.getElementById('answerInput');
  inp.value = ''; inp.disabled = false; inp.className = 'answer-input'; inp.focus();

  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '확인';
  const fbEl = document.getElementById('feedback');
  fbEl.className = 'feedback';
  fbEl.style.display = 'none';
  document.getElementById('actionRow').style.display = 'none';
  document.getElementById('skipRow').style.display = 'block';
  document.getElementById('hintRow').style.display = 'block';
  document.getElementById('hintToggleBtn').textContent = '힌트 보기';
  document.getElementById('hintBox').className = 'hint-box';
  document.getElementById('hintBox').textContent = '';
  document.getElementById('quizCard').className = 'quiz-card';

  document.getElementById('progressFill').style.width =
    (currentIdx / queue.length * 100).toFixed(1) + '%';

  closeAc();
  updateStatsUI();

  if (mode === 'hint') { hintLevel = 1; showHintStep(); }
}

// SUBMIT
function submitAnswer() {
  if (answered) { nextQuestion(); return; }
  const val = document.getElementById('answerInput').value.trim();
  if (!val) { document.getElementById('answerInput').focus(); return; }

  closeAc();
  answered = true;
  const ok = checkAnswer(val, current.answer);

  stats.total++;
  if (ok) {
    stats.correct++;
    streak++;
    wrongList = wrongList.filter(w => w.id !== current.id);
    if (streak >= 3) triggerConfetti();
  } else {
    streak = 0;
    if (!wrongList.find(w => w.id === current.id))
      wrongList.push({ id: current.id, question: current.question, answer: current.answer });
  }
  saveState();

  const inp = document.getElementById('answerInput');
  inp.disabled = true;
  inp.className = 'answer-input ' + (ok ? 'correct' : 'wrong');

  const card = document.getElementById('quizCard');
  card.className = 'quiz-card ' + (ok ? 'correct' : 'wrong');
  if (!ok) { card.style.animation = 'shake 0.4s ease'; setTimeout(() => card.style.animation = '', 400); }
  else      { card.style.animation = 'pop 0.3s ease';  setTimeout(() => card.style.animation = '', 300); }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (ok ? 'correct' : 'wrong');
  fb.style.display = 'flex';
  document.getElementById('fbIcon').textContent   = ok ? '✓' : '✗';
  document.getElementById('fbLabel').textContent  = ok ? '정답입니다!' : '오답입니다';
  const kingdomSuffix = (current.type === '왕' && current.kingdom) ? ` (${current.kingdom})` : '';
  document.getElementById('fbAnswer').textContent = '정답: ' + current.answer + kingdomSuffix;
  document.getElementById('fbAccept').textContent = !ok
    ? `인정 범위: ${getAccepted(current.answer).join(' / ')}` : '';

  document.getElementById('submitBtn').textContent = '다음 →';
  document.getElementById('actionRow').style.display = 'flex';
  document.getElementById('skipRow').style.display   = 'none';
  document.getElementById('hintRow').style.display   = 'none';
  document.getElementById('cardMeta').classList.add('visible');

  updateStatsUI();
  updateStreakBadge();
}

function nextQuestion(reset) {
  if (!reset) {
    currentIdx++;
    if (currentIdx >= queue.length) buildQueue();
  }
  renderQuestion(queue[currentIdx] || queue[0]);
}

function skipQuestion() {
  if (!answered) {
    stats.total++;
    if (!wrongList.find(w => w.id === current.id))
      wrongList.push({ id: current.id, question: current.question, answer: current.answer });
    saveState();
  }
  currentIdx++;
  if (currentIdx >= queue.length) buildQueue();
  renderQuestion(queue[currentIdx] || queue[0]);
}

// HINT
function toggleHint() { hintLevel = Math.min(hintLevel + 1, 3); showHintStep(); }
function showHintStep() {
  const a = current.answer;
  const texts = [
    `유형: ${current.type} | 단원: ${current.subUnit}`,
    `첫 글자: ${a[0]}${'_'.repeat(Math.max(0, a.length-1))}`,
    `앞부분: ${a.substring(0, Math.ceil(a.length/2))}${'_'.repeat(a.length - Math.ceil(a.length/2))}`,
    `정답: ${a}`
  ];
  const labels = ['단원 힌트', '첫 글자 보기', '더 보기', '정답 공개'];
  document.getElementById('hintBox').textContent    = texts[hintLevel-1] || texts[0];
  document.getElementById('hintBox').className      = 'hint-box show';
  document.getElementById('hintToggleBtn').textContent = hintLevel >= 3 ? '정답 공개' : labels[hintLevel] || '힌트';
}

// AUTOCOMPLETE
const allAnswers = [...new Set(QUESTIONS_DATA.map(q => q.answer))].sort();

function updateAc() {
  if (answered) { closeAc(); return; }
  const val = document.getElementById('answerInput').value;
  if (!val) { closeAc(); return; }
  const lo = val.replace(/\s/g,'').toLowerCase();
  currentMatches = allAnswers.filter(a => a.replace(/\s/g,'').toLowerCase().includes(lo)).slice(0,8);
  const list = document.getElementById('acList');
  if (!currentMatches.length) { closeAc(); return; }
  list.innerHTML = currentMatches.map(m =>
    `<div class="ac-item" data-val="${m.replace(/"/g,'&quot;')}" onmousedown="pickAc(this)">${hlMatch(m,val)}</div>`
  ).join('');
  list.classList.add('show');
  document.getElementById('answerInput').classList.add('open');
  acIdx = -1;
}

function hlMatch(ans, q) {
  const lo = q.replace(/\s/g,'').toLowerCase();
  const an = ans.replace(/\s/g,'');
  const pos = an.toLowerCase().indexOf(lo);
  if (pos < 0) return ans;
  let ni=0, s=-1, e=-1;
  for (let i=0; i<ans.length; i++) {
    if (ans[i] !== ' ') {
      if (ni===pos) s=i;
      if (ni===pos+lo.length-1) { e=i+1; break; }
      ni++;
    }
  }
  if (s<0||e<0) return ans;
  return ans.slice(0,s)+`<mark>${ans.slice(s,e)}</mark>`+ans.slice(e);
}

function pickAc(el) {
  document.getElementById('answerInput').value = el.dataset.val;
  closeAc();
  setTimeout(() => document.getElementById('answerInput').focus(), 10);
}

function closeAc() {
  document.getElementById('acList').classList.remove('show');
  document.getElementById('answerInput').classList.remove('open');
  currentMatches = []; acIdx = -1;
}

function navAc(d) {
  const items = document.querySelectorAll('.ac-item');
  if (!items.length) return false;
  items.forEach(i => i.classList.remove('selected'));
  acIdx = (acIdx + d + items.length) % items.length;
  const sel = items[acIdx];
  sel.classList.add('selected');
  document.getElementById('answerInput').value = sel.dataset.val;
  return true;
}

// STATS
function updateStatsUI() {
  const rate = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
  document.getElementById('statTotal').textContent   = stats.total;
  document.getElementById('statCorrect').textContent = stats.correct;
  document.getElementById('statRate').textContent    = rate + '%';
  document.getElementById('wrongCount').textContent  = wrongList.length;
}

function updateStreakBadge() {
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('streakBadge').classList.toggle('show', streak >= 3);
}

function resetStats() {
  if (!confirm('통계와 오답 노트를 초기화할까요?')) return;
  stats = { total: 0, correct: 0 };
  wrongList = []; streak = 0;
  saveState(); updateStatsUI(); updateStreakBadge();
}

// WRONG NOTE
function openWrongNote() {
  document.getElementById('wrongBody').innerHTML = !wrongList.length
    ? '<div class="empty-msg">오답이 없습니다!</div>'
    : wrongList.map(w =>
        `<div class="wrong-item">
          <div class="wrong-q">${w.question}</div>
          <div class="wrong-a"><span>정답: </span>${w.answer}</div>
        </div>`
      ).join('');
  document.getElementById('wrongPanel').classList.add('show');
}
function closeWrongNote() {
  document.getElementById('wrongPanel').classList.remove('show');
}

// CONFETTI
function triggerConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const clr = ['#c9a227','#e8c547','#2ecc71','#3498db','#e74c3c','#9b59b6','#ff6b35'];
  for (let i = 0; i < 32; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText =
      `left:${Math.random()*100}%;top:${-5+Math.random()*10}%;` +
      `width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;` +
      `background:${clr[i%clr.length]};` +
      `border-radius:${Math.random()>.5?'50%':'3px'};` +
      `animation-delay:${Math.random()*0.4}s;` +
      `animation-duration:${1+Math.random()*0.5}s`;
    wrap.appendChild(el);
  }
  setTimeout(() => wrap.innerHTML = '', 2200);
}

// KEYBOARD
const inp = document.getElementById('answerInput');
inp.addEventListener('keydown', e => {
  if (document.getElementById('acList').classList.contains('show')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); navAc(1);  return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); navAc(-1); return; }
    if (e.key === 'Escape')    { closeAc(); return; }
    if (e.key === 'Tab')       { e.preventDefault(); navAc(1);  return; }
  }
  if (e.key === 'Enter' && !answered) { e.stopPropagation(); submitAnswer(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && answered) nextQuestion();
});

inp.addEventListener('input', updateAc);
inp.addEventListener('blur', () => setTimeout(closeAc, 150));

document.getElementById('wrongPanel').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeWrongNote();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

// INIT
loadState();
buildFilterBar();
buildQueue();
renderQuestion(queue[0]);
updateStatsUI();
</script>
</body>
</html>
